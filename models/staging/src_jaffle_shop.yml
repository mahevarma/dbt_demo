version: 2

sources:
  - name: jaffle_shop
    description: Raw Jaffle Shop data coming from AWS S3.
    database: raw  
    schema: jaffle_shop  
    tables:
      - name: orders
        description: Raw orders data.
        columns:
          - name: id
            description: Primary key for orders.
            tests:
              - unique
              - not_null

      - name: customers
        description: Raw customers data.
        columns:
          - name: id
            description: Primary key for customers.
            tests:
              - unique
              - not_null

  - name: stripe
    database: raw  
    schema: stripe
    tables:
      - name: payment
        loaded_at_field: _batched_at
        freshness:
         warn_after: {count: 9, period: day}
         error_after: {count: 10,period: day}